<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim App</title>
    <style>
        /* Styles principaux basés sur image.png */
        body {
            background-color: #050811; /* Fond très sombre */
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Titre Principal */
        .main-title {
            color: #2ec4b6; /* Vert fluo / Turquoise */
            font-size: 2.5rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .sub-title {
            color: #1f4037;
            font-size: 0.9rem;
            font-style: italic;
            margin-bottom: 25px;
        }

        /* Barre de navigation */
        .navbar {
            background-color: #0d1527;
            border-radius: 15px;
            padding: 10px 15px;
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 450px;
            justify-content: space-around;
        }

        .nav-item {
            color: #a0aec0;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .nav-item.active {
            background-color: #0096c7; /* Fond vert/bleu de l'onglet actif */
            color: white;
        }

        .nav-item.aider {
            color: #f77f00; /* Couleur orange pour Aider */
        }

        /* Zone des Quiz */
        .quiz-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Style des gros boutons de quiz */
        .quiz-box {
            background-color: #091124;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            font-style: italic;
            text-transform: uppercase;
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .quiz-box:hover {
            transform: scale(1.02);
        }

        /* Couleurs des bordures lumineuses style néon */
        .blue-border {
            border: 2px solid #0077b6;
            box-shadow: 0 0 10px rgba(0, 119, 182, 0.3);
        }

        .green-border {
            border: 2px solid #2a9d8f;
            box-shadow: 0 0 10px rgba(42, 157, 143, 0.3);
        }

        .purple-border {
            border: 2px solid #8a2be2;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }

        .gold-border {
            border: 2px solid #e9c46a;
            box-shadow: 0 0 10px rgba(233, 196, 106, 0.3);
        }

        .orange-border {
            border: 2px solid #f4a261;
            box-shadow: 0 0 10px rgba(244, 162, 97, 0.3);
        }

        /* Compteur de visites en bas */
        .counter-box {
            border: 2px solid #1d3557;
            background-color: #091124;
            color: #457b9d;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter-dot {
            width: 8px;
            height: 8px;
            background-color: #457b9d;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <!-- 1. TON TITRE PRINCIPAL -->
    <h1 class="main-title">MUSLIM APP</h1>
    <div class="sub-title">20 UNDEFINED 1447</div>

    <!-- 2. TA BARRE DE NAVIGATION (NAVBAR) -->
    <nav class="navbar">
        <a href="#" class="nav-item">Home</a>
        <a href="#" class="nav-item">Piliers</a>
        <a href="#" class="nav-item">Coran</a>
        <a href="#" class="nav-item">Guide</a>
        <a href="#" class="nav-item active">Quiz</a>
        <a href="#" class="nav-item aider">Aider</a>
    </nav>

    <!-- 3. LA SECTION CONTENANT TOUS TES QUIZ (ANCIENS + NOUVEAUX) -->
    <div class="quiz-container" id="quiz-section">
        <div class="quiz-box blue-border" id="quiz-coran">📖 QUIZ CORAN</div>
        <div class="quiz-box green-border" id="quiz-piliers">🕌 QUIZ PILIERS</div>
        
        <!-- Nouveaux ajoutés qui s'intègrent maintenant parfaitement dans le design -->
        <div class="quiz-box purple-border" id="quiz-priere">🧎 QUIZ PRIÈRE</div>
        <div class="quiz-box gold-border" id="quiz-sirah">📜 QUIZ SÎRAH</div>
        <div class="quiz-box orange-border" id="quiz-ramadan">🌙 QUIZ RAMADAN</div>
    </div>

    <!-- 4. TON COMPTEUR DE VISITES -->
    <div class="counter-box">
        <span class="counter-dot"></span>
        1 VISITES TOTALES
    </div>

</body>
</html>
